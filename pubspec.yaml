name: aakaash
description: Aakaash — beautiful Flutter weather app for Bangladesh with BDApps subscription.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0
  google_generative_ai: ^0.4.7

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Push notifications (local + background periodic worker)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  workmanager: ^0.9.0+3
  permission_handler: ^11.2.0

  # UI / Animation
  flutter_typeahead: ^4.8.0
  lottie: ^3.0.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  fl_chart: ^0.66.2
  glassmorphism: ^3.0.0

  # State / Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Utility
  intl: ^0.19.0
  url_launcher: ^6.2.4
  home_widget: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/brand/
    - assets/logo/
    - assets/map/
